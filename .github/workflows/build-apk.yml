name: Build Star Isle APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Prepare source
        run: |
          if [ -f StarIsle_Flutter_Android_Source.zip ]; then
            unzip -q StarIsle_Flutter_Android_Source.zip
          fi
          test -f star_isle/pubspec.yaml
          chmod +x star_isle/android/gradlew
      - name: Build APK
        working-directory: star_isle
        run: |
          flutter pub get
          flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: StarIsle-release-apk
          path: star_isle/build/app/outputs/flutter-apk/app-release.apk
