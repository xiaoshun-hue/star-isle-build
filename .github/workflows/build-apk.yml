name: Build Star Isle APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
      - name: Prepare source
        run: |
          if [ -f StarIsle_Flutter_Android_Source.zip ]; then
            unzip -q StarIsle_Flutter_Android_Source.zip
          fi
          test -f star_isle/pubspec.yaml
          chmod +x star_isle/android/gradlew
          sed -i -E 's/compileSdk = (34|35)/compileSdk = 36/' star_isle/android/app/build.gradle
          sed -i '/postSplashScreenTheme/d' star_isle/android/app/src/main/res/values-v31/styles.xml star_isle/android/app/src/main/res/values-night-v31/styles.xml
          sed -i 's/^  path: 1.9.0$/  path: ^1.9.1/' star_isle/pubspec.yaml
          sed -i 's/version "8.3.2"/version "8.9.1"/' star_isle/android/settings.gradle
          sed -i 's/version "1.9.22"/version "2.1.0"/' star_isle/android/settings.gradle
          sed -i 's/gradle-8.4-bin.zip/gradle-8.11.1-bin.zip/' star_isle/android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/suppressUnsupportedCompileSdk/d' star_isle/android/gradle.properties
      - name: Build APK
        working-directory: star_isle
        run: |
          flutter pub get
          flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: StarIsle-release-apk
          path: star_isle/build/app/outputs/flutter-apk/app-release.apk
